<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Switch Point</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fbf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // GitHub Pages SPA fallback: only real app routes (/works/…) are sent back into the app;
      // every other unknown URL shows this 404 page instead of silently landing on the homepage.
      (function () {
        var l = window.location;
        if (/^\/works(\/|$)/.test(l.pathname)) l.replace('/works' + l.search + l.hash);
        try {
          var t = localStorage.getItem('sp_theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #4f5b92; --on-primary: #ffffff; --primary-container: #dde1ff; --on-primary-container: #374379;
        --surface: #fbf8ff; --surface-container: #efedf4; --on-surface: #1b1b21; --on-surface-variant: #45464f; --outline: #767680;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --primary: #b8c3ff; --on-primary: #202c61; --primary-container: #374379; --on-primary-container: #dde1ff;
          --surface: #121318; --surface-container: #1f1f25; --on-surface: #e3e1e9; --on-surface-variant: #c6c5d0; --outline: #90909a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --primary: #b8c3ff; --on-primary: #202c61; --primary-container: #374379; --on-primary-container: #dde1ff;
        --surface: #121318; --surface-container: #1f1f25; --on-surface: #e3e1e9; --on-surface-variant: #c6c5d0; --outline: #90909a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--surface); color: var(--on-surface); font-family: "Roboto", system-ui, sans-serif; }
      main { width: 100%; max-width: 560px; background: var(--surface-container); border-radius: 28px; padding: 40px 32px; text-align: center; }
      .logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 24px; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); font: 700 22px "Google Sans Flex", sans-serif; }
      .code { font: 400 57px/64px "Google Sans Flex", sans-serif; letter-spacing: -0.25px; color: var(--primary); }
      h1 { margin-top: 8px; font: 400 28px/36px "Google Sans Flex", sans-serif; }
      p { margin-top: 12px; font-size: 16px; line-height: 24px; letter-spacing: .5px; color: var(--on-surface-variant); }
      .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a.btn { display: inline-flex; align-items: center; height: 40px; padding: 0 24px; border-radius: 9999px; font: 500 14px/20px "Roboto", sans-serif; letter-spacing: .1px; text-decoration: none; }
      .filled { background: var(--primary); color: var(--on-primary); }
      .outlined { color: var(--primary); border: 1px solid var(--outline); }
      a.btn:hover { box-shadow: inset 0 0 0 100px color-mix(in srgb, currentColor 8%, transparent); }
      a.btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">SP</div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved. Let's get you back to Switch Point.</p>
      <div class="actions">
        <a class="btn filled" href="/">Back to homepage</a>
        <a class="btn outlined" href="/#products">See our products</a>
      </div>
    </main>
  </body>
</html>
